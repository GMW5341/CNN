<svg xmlns="http://www.w3.org/2000/svg" width="224" height="224" viewBox="0 0 224 224">
  <defs>
    <radialGradient id="skin1" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f5d0a9"/>
      <stop offset="60%" stop-color="#e8b88a"/>
      <stop offset="100%" stop-color="#c4956a"/>
    </radialGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(220,120,120,0.3)"/>
      <stop offset="100%" stop-color="rgba(220,120,120,0)"/>
    </radialGradient>
  </defs>
  <!-- Face base -->
  <ellipse cx="112" cy="120" rx="80" ry="95" fill="url(#skin1)"/>
  <!-- Forehead -->
  <ellipse cx="112" cy="65" rx="70" ry="40" fill="#f0c896" opacity="0.5"/>
  <!-- Eyes -->
  <ellipse cx="82" cy="105" rx="15" ry="10" fill="#fff"/>
  <ellipse cx="142" cy="105" rx="15" ry="10" fill="#fff"/>
  <circle cx="82" cy="105" r="6" fill="#4a3728"/>
  <circle cx="142" cy="105" r="6" fill="#4a3728"/>
  <circle cx="84" cy="103" r="2" fill="#fff"/>
  <circle cx="144" cy="103" r="2" fill="#fff"/>
  <!-- Eyebrows -->
  <path d="M60 88 Q82 78 100 86" stroke="#6b4423" stroke-width="3" fill="none"/>
  <path d="M124 86 Q142 78 164 88" stroke="#6b4423" stroke-width="3" fill="none"/>
  <!-- Nose -->
  <path d="M108 110 Q112 135 116 110" stroke="#c4956a" stroke-width="1.5" fill="none"/>
  <ellipse cx="112" cy="130" rx="8" ry="4" fill="#d4a574" opacity="0.5"/>
  <!-- Mouth -->
  <path d="M92 150 Q112 165 132 150" stroke="#c47070" stroke-width="2.5" fill="#d48080"/>
  <!-- Cheek blush -->
  <circle cx="65" cy="130" r="20" fill="url(#blush)"/>
  <circle cx="159" cy="130" r="20" fill="url(#blush)"/>
  <!-- Spots (pigmentation) -->
  <circle cx="75" cy="85" r="3" fill="#b8956e" opacity="0.6"/>
  <circle cx="140" cy="75" r="2" fill="#b8956e" opacity="0.5"/>
  <circle cx="95" cy="140" r="2.5" fill="#a88060" opacity="0.4"/>
  <circle cx="135" cy="145" r="2" fill="#a88060" opacity="0.4"/>
  <!-- Forehead lines -->
  <path d="M80 55 Q112 50 144 55" stroke="#c4956a" stroke-width="0.5" opacity="0.4" fill="none"/>
  <path d="M85 62 Q112 58 139 62" stroke="#c4956a" stroke-width="0.5" opacity="0.3" fill="none"/>
</svg>
